<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive — Elias Andre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #fbfaf6;
    --ink: #1c1b17;
    --ink-dim: #9a9686;
    --ink-faint: #c7c3b6;
    --line: #e5e2d6;
    --red: #b84a2a;
    --yellow: #e6b13c;
    --blue: #4c74a8;
    --font: 'Inter', system-ui, sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    height:100%;
    overflow:hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; 
    user-select: none; 
  }
  body::before{
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 96px;
    background: linear-gradient(to bottom, var(--bg) 0%, rgba(251,250,246,.94) 46%, rgba(251,250,246,0) 100%);
    pointer-events: none;
    z-index: 15;
  }

  /* ---------- chrome ---------- */
  .wordmark{
    position: fixed; top: 26px; left: 28px;
    display:flex; align-items:center; gap: 9px;
    z-index: 20;
    pointer-events: none;
  }
  .dots{ display:flex; }
  .dots span{ width:8px; height:8px; border-radius:50%; display:block; margin-left:-3px; }
  .dots span:first-child{ margin-left:0; background: var(--red); }
  .dots span:nth-child(2){ background: var(--yellow); }
  .dots span:nth-child(3){ background: var(--blue); }
  .wordmark .name{ font-size:15px; font-weight:600; letter-spacing:-0.01em; }

  .category-picker{
    position: fixed;
    top: 22px;
    right: 28px;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .category-picker .collection-label{
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .category-nav{
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 3px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--bg);
    box-shadow: 0 8px 24px -18px rgba(28,27,23,.55);
  }
  .category-track{
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .category-nav button{
    appearance: none;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    font: 600 11px/1 var(--font);
    letter-spacing: .02em;
    padding: 8px 12px;
    cursor: pointer;
    transition: color .2s ease, background-color .25s ease, opacity .2s ease;
  }
  .category-nav button[aria-current="page"]{
    background: var(--ink);
    color: var(--bg);
  }
  .category-nav button:disabled{ cursor: default; }
  .category-nav button:focus-visible{
    outline: 2px solid var(--blue);
    outline-offset: 2px;
  }

  @media (max-width: 640px){
    body::after{
      content: "";
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 116px;
      z-index: 15;
      pointer-events: none;
      background: linear-gradient(to top, var(--bg) 0%, rgba(251,250,246,.9) 42%, rgba(251,250,246,0) 100%);
    }
    .wordmark{
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      justify-content: center;
      width: calc(100% - 32px);
    }
    .wordmark .name{ max-width: none; font-size: 12px; white-space: nowrap; }
    .category-picker{
      top: auto;
      bottom: 38px;
      left: 50%;
      right: auto;
      transform: translateX(-50%);
    }
    .category-picker::before{
      content: "";
      position: absolute;
      inset: -24px -34px -18px;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(0,0,0,.2) 0%, rgba(0,0,0,.08) 42%, rgba(0,0,0,0) 74%);
      filter: blur(8px);
    }
    .category-picker .collection-label{ display:none; }
    .category-nav{
      position: relative;
      width: min(286px, calc(100vw - 64px));
      display: block;
      padding: 4px 0;
      overflow-x: hidden;
      overscroll-behavior-x: contain;
      touch-action: pan-y;
      scrollbar-width: none;
      box-shadow: 0 10px 26px -15px rgba(0,0,0,.62);
      scroll-behavior: smooth;
    }
    .category-edge{
      display: block;
      position: absolute;
      z-index: 2;
      top: 1px;
      width: 54px;
      height: 46px;
      pointer-events: none;
    }
    .category-edge.left{
      left: 1px;
      border-radius: 999px 0 0 999px;
      background: linear-gradient(90deg, var(--bg) 12%, rgba(251,250,246,.96) 30%, rgba(251,250,246,.68) 62%, rgba(251,250,246,0) 100%);
    }
    .category-edge.right{
      right: 1px;
      border-radius: 0 999px 999px 0;
      background: linear-gradient(270deg, var(--bg) 12%, rgba(251,250,246,.96) 30%, rgba(251,250,246,.68) 62%, rgba(251,250,246,0) 100%);
    }
    .category-track{
      display: flex;
      align-items: center;
      gap: 4px;
      width: max-content;
    }
    .category-track::before,
    .category-track::after{
      content: "";
      flex: 0 0 calc(min(143px, calc(50vw - 32px)) - 18px);
    }
    .category-nav::-webkit-scrollbar{ display:none; }
    .category-nav button{
      flex: 0 0 auto;
      min-height: 40px;
      padding: 0 17px;
      font-size: 12px;
    }
  }

  /* ---------- stage / world ---------- */
  #stage{
    position: fixed; inset: 0;
    cursor: grab;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
  }
  #stage.grabbing{ cursor: grabbing; }
  #world{
    position: absolute;
    top: 50%; left: 50%;
    width: 1400px; height: 1400px;
    transform-origin: 0 0;
    will-change: transform;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #world.ready {
    opacity: 1;
  }

  #world.collection-exiting{
    pointer-events: none;
  }
  #world.collection-exiting .tile{
    opacity: 0 !important;
    scale: .08;
    transition-delay: calc(var(--switch-order, 0) * 12ms);
    transition-duration: .32s, .42s, .15s, .3s, .45s, .45s, .6s, .32s;
  }
  #world.collection-entering .tile{
    transition-delay: calc(var(--switch-order, 0) * 12ms);
  }
  
  #world.transitioning {
    transition: opacity 0.4s ease;
  }

  #world::after{
    content: "";
    position: absolute;
    inset: 0;
    z-index: 40;
    pointer-events: none;
    opacity: 0;
    background: rgba(244,242,237,.025);
    -webkit-backdrop-filter: blur(8px) grayscale(30%);
    backdrop-filter: blur(8px) grayscale(30%);
    transition: opacity .22s ease;
  }
  #world.has-focus::after{ opacity: 1; }

  #world.has-focus .tile:not(.focused):not(.unfocusing) {
    opacity: 0.4;
  }

  /* ---------- tiles ---------- */
  .tile{
    position: absolute;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: #fff;
    box-shadow: var(--card-shadow, 10px 14px 24px -10px rgba(28,27,23,0.3));
    overflow: visible;
    cursor: pointer;
    opacity: 0;
    scale: 0.02;
    pointer-events: none;
    contain: layout style;
    backface-visibility: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    transition:
      transform .55s cubic-bezier(0.22, 1, 0.36, 1),
      scale .72s cubic-bezier(0.16, 1, 0.3, 1),
      border-color .15s ease,
      border-width .3s ease,
      border-radius .45s cubic-bezier(0.22, 1, 0.36, 1),
      box-shadow .45s ease,
      filter .6s ease,
      opacity .42s ease;
  }
  .tile.media-ready{
    opacity: 1;
    scale: 1;
    pointer-events: auto;
  }
  .tile:not(.media-ready){
    opacity: 0 !important;
  }
  .tile:hover{ border-color: var(--ink-faint); z-index: 5; }
  
  .tile.focused {
    z-index: 50;
    border-width: 0;
    border-radius: 0;
    box-shadow: none;
    transform: rotate(0deg) !important;
  }
  .tile.unfocusing{
    z-index: 50;
  }
  .tile.focus-motion{
    transition:
      scale .72s cubic-bezier(0.16, 1, 0.3, 1),
      border-color .15s ease,
      border-width .3s ease,
      border-radius .45s cubic-bezier(0.22, 1, 0.36, 1),
      box-shadow .45s ease,
      opacity .42s ease;
    will-change: transform;
  }

  .tile img, .tile video{
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none; 
    border-radius: inherit;
    backface-visibility: hidden;
    transform: translateZ(0);
    transition: border-radius .45s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .tile .caption{
    position: absolute; left:0; right:0; bottom:0;
    padding: 18px 10px 7px;
    background: linear-gradient(to top, rgba(8,8,8,0.82) 0%, rgba(8,8,8,0.42) 58%, rgba(8,8,8,0) 100%);
    border-radius: 0 0 5px 5px;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.35);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .15s ease, transform .15s ease, border-radius .45s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
    z-index: 2;
  }
  .tile:hover .caption, .tile.focused .caption { 
    opacity: 1; transform: none; 
  }
  .tile.focused .caption{
    border-radius: 0;
  }

  .tile .info{
    position: absolute;
    top: calc(100% + 9px);
    left: 4px; right: 4px;
    padding: 8px 10px;
    border: 1px solid rgba(229,226,214,0.8);
    border-radius: 5px;
    background: rgba(251,250,246,0.94);
    color: var(--ink-dim);
    font-size: 9px;
    line-height: 1.45;
    letter-spacing: 0.01em;
    opacity: 0;
    transform: translateY(-3px);
    transition: opacity .2s ease .25s, transform .2s ease .25s;
    pointer-events: none;
  }
  .tile.focused .info,
  .tile.unfocusing .info{
    transform: none;
    top: calc(100% + 9px * var(--focus-ui-scale, 1));
    left: 0;
    right: 0;
    padding: calc(8px * var(--focus-ui-scale, 1)) 0 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font-size: calc(12.5px * var(--focus-ui-scale, 1));
    font-weight: 600;
    line-height: 1.45;
  }
  .tile.focused .info{
    opacity: 1;
  }
  .tile.unfocusing .info{
    opacity: 0;
    transition: opacity .15s ease;
  }

  @media (min-width: 641px) {
    .tile.focused .caption,
    .tile.unfocusing .caption{
      top: auto;
      bottom: calc(100% + 10px * var(--focus-ui-scale, 1));
      padding: 0;
      background: transparent;
      border-radius: 0;
      color: var(--ink);
      font-size: calc(15px * var(--focus-ui-scale, 1));
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: .035em;
      text-shadow: none;
    }

    .tile.focused .info,
    .tile.unfocusing .info{
      font-size: calc(9px * var(--focus-ui-scale, 1));
    }

    .tile.focused .caption,
    .tile.focused .info,
    .tile.unfocusing .caption{
      opacity: 0;
      transition: opacity .32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .tile.focused.focus-settled .caption,
    .tile.focused.focus-settled .info{
      opacity: 1;
    }

    .tile.focused.focus-exiting .caption,
    .tile.focused.focus-exiting .info{
      opacity: 0;
      transition: opacity .3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .tile.focus-entering .caption,
    .tile.focus-entering .info{
      opacity: 0;
      transition: opacity .3s cubic-bezier(0.22, 1, 0.36, 1);
    }
  }

  @media (max-width: 640px) {
    .tile:hover:not(.focused) .caption,
    .tile:not(.focused) .caption{
      opacity: 0;
      transform: translateY(4px);
    }

    .tile:hover:not(.focused){
      border-color: var(--line);
    }

    .tile:focus,
    .tile:focus-visible{
      outline: none;
    }

    .tile.focused .caption,
    .tile.unfocusing .caption{
      top: auto;
      bottom: calc(100% + 10px * var(--focus-ui-scale, 1));
      padding: 0;
      background: transparent;
      border-radius: 0;
      color: var(--ink);
      font-size: calc(16px * var(--focus-ui-scale, 1));
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: .035em;
      text-shadow: none;
      transform: none;
      transition: opacity .32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .tile.focused .caption,
    .tile.focused .info{
      opacity: 0;
      transition: opacity .32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .tile.focused.focus-settled .caption,
    .tile.focused.focus-settled .info{
      opacity: 1;
    }

    .tile.focused.focus-exiting .caption,
    .tile.focused.focus-exiting .info,
    .tile.unfocusing .caption,
    .tile.unfocusing .info{
      opacity: 0;
      transition: opacity .3s cubic-bezier(0.22, 1, 0.36, 1);
    }
  }

  @media (max-width: 640px) and (orientation: portrait) {
    #stage{
      overflow-x: hidden;
      overflow-y: auto;
      touch-action: pan-y;
      overscroll-behavior-y: none;
      cursor: default;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #stage::-webkit-scrollbar{ display:none; }
    #stage.mobile-focus-mode{ overflow: hidden; }
    #world{
      position: relative;
      top: 0;
      left: 50%;
      margin-left: -700px;
      transform: none !important;
    }
    .tile.focused{
      transform: translate(var(--mobile-focus-x, 0), var(--mobile-focus-y, 0)) scale(var(--mobile-focus-scale, 1)) rotate(0deg) !important;
    }
  }

  .tile .placeholder{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 8px;
    background:
      repeating-linear-gradient(135deg, #f1efe8 0px, #f1efe8 10px, #ece9df 10px, #ece9df 20px);
    border-radius: inherit;
    overflow: hidden;
  }
  .tile .placeholder svg{ width:18px; height:18px; stroke: var(--ink-faint); }
  .tile .placeholder span{
    font-size: 9px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color: var(--ink-dim);
  }
  .tile img.missing, .tile video.missing{ display:none; }
</style>
</head>
<body>

  <div class="wordmark">
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="name">Elias Andre Archive | © 2026 All rights reserved</div>
  </div>
  <div class="category-picker">
    <span class="collection-label">Collection</span>
    <nav class="category-nav" id="category-nav" aria-label="Choose a collection">
      <div class="category-track" id="category-track"></div>
    </nav>
    <span class="category-edge left" aria-hidden="true"></span>
    <span class="category-edge right" aria-hidden="true"></span>
  </div>
  <div id="stage">
    <div id="world"></div>
  </div>

<script>
let MEDIA = [];
let mediaBaseUrl = '';
let categories = [];
let activeCategory = null;
let categorySwitching = false;

const SIZES = { sm: 130, md: 190, lg: 250 };
const ROTATIONS = [-3.4, 1.8, -2.2, 3.7, -1.3, 2.8, -3.9, 1.1, 3.1, -2.7, 1.6, -3.2, 2.4, -1.8, 3.9, -2.5, 1.4];
const CARD_SHADOWS = [
  '12px 15px 25px -10px rgba(28,27,23,0.30)',
  '-9px 14px 23px -11px rgba(28,27,23,0.27)',
  '15px 9px 27px -12px rgba(28,27,23,0.29)',
  '-12px 11px 24px -10px rgba(28,27,23,0.25)',
  '8px 17px 26px -11px rgba(28,27,23,0.31)',
  '14px -5px 25px -12px rgba(28,27,23,0.24)',
  '-7px 16px 28px -12px rgba(28,27,23,0.29)',
];
const world = document.getElementById('world');
const CENTER = 700; 
const GAP = 12; 
let placedRects = [];
let overviewCenter = { x: CENTER, y: CENTER };
let overviewBounds = { left: CENTER, right: CENTER, top: CENTER, bottom: CENTER };
let portraitRows = [];
let portraitCycleHeight = 0;

function isPortraitMobile(){
  return window.innerWidth <= 640 && window.innerHeight > window.innerWidth;
}

function overlaps(a, b, pad){
  return a.left - pad < b.right && a.right + pad > b.left &&
         a.top - pad < b.bottom && a.bottom + pad > b.top;
}

function findSpot(w, h){
  const dTheta = 0.11;
  const growth = 5.5;
  let theta = Math.random() * Math.PI * 2; 
  let iterations = 0;
  while (iterations < 4000) {
    const r = growth * theta;
    const cx = CENTER + r * Math.cos(theta);
    const cy = CENTER + r * Math.sin(theta);
    const rect = { left: cx - w/2, top: cy - h/2, right: cx + w/2, bottom: cy + h/2 };
    const collides = placedRects.some(p => overlaps(rect, p, GAP));
    if (!collides) {
      placedRects.push(rect);
      return { x: cx, y: cy };
    }
    theta += dTheta;
    iterations++;
  }
  const cx = CENTER, cy = CENTER;
  placedRects.push({ left: cx - w/2, top: cy - h/2, right: cx + w/2, bottom: cy + h/2 });
  return { x: cx, y: cy };
}

function revealTile(tile, placeholder, keepPlaceholder = false) {
  if (tile.classList.contains('media-ready')) return;
  if (!keepPlaceholder) placeholder.style.display = 'none';

  // Two frames guarantee that the browser paints the tiny initial state
  // before transitioning the tile to its normal size.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    tile.classList.add('media-ready');
  }));
}

function mediaUrl(item){
  if (/^https?:\/\//i.test(item.file)) return item.file;
  return mediaBaseUrl.replace(/\/?$/, '/') + item.file.replace(/^\//, '');
}

function buildPortraitPlan(entries){
  const remaining = [...entries];
  const plan = new Map();
  const unitCost = { lg: 6, md: 3, sm: 2 };
  const rowShifts = [-8, 7, -3, 10, 2, -7];
  const rowGaps = [24, 32, 20, 28, 18, 30];
  const verticalJitter = [-5, 3, 0, 5, -3, 2];
  let top = 0;
  let rowIndex = 0;

  portraitRows = [];

  while (remaining.length) {
    const row = [remaining.shift()];
    let used = unitCost[row[0].item.size] || 3;

    for (let cursor = 0; cursor < remaining.length && used < 6;) {
      const cost = unitCost[remaining[cursor].item.size] || 3;
      if (used + cost <= 6) {
        row.push(remaining.splice(cursor, 1)[0]);
        used += cost;
      } else {
        cursor++;
      }
    }

    const gap = row.length === 3 ? 10 : 14;
    const rowWidth = row.reduce((sum, entry) => sum + entry.w, 0) + gap * (row.length - 1);
    const rowHeight = Math.max(...row.map(entry => entry.h));
    let left = CENTER - rowWidth / 2 + rowShifts[rowIndex % rowShifts.length];
    let rowTop = Infinity;
    let rowBottom = -Infinity;

    row.forEach((entry, itemIndex) => {
      const y = top + rowHeight / 2 + verticalJitter[(rowIndex + itemIndex) % verticalJitter.length];
      const x = left + entry.w / 2;
      plan.set(entry.i, { x, y, rowIndex });
      rowTop = Math.min(rowTop, y - entry.h / 2);
      rowBottom = Math.max(rowBottom, y + entry.h / 2);
      placedRects.push({ left, top: y - entry.h / 2, right: left + entry.w, bottom: y + entry.h / 2 });
      left += entry.w + gap;
    });

    portraitRows.push({ top: rowTop, bottom: rowBottom, shift: 0, tiles: [] });
    top = rowBottom + rowGaps[rowIndex % rowGaps.length];
    rowIndex++;
  }

  const contentTop = Math.min(...portraitRows.map(row => row.top));
  const contentBottom = Math.max(...portraitRows.map(row => row.bottom));
  portraitCycleHeight = contentBottom - contentTop + 34;
  plan.forEach(placement => { placement.y += portraitCycleHeight; });
  portraitRows.forEach(row => {
    row.top += portraitCycleHeight;
    row.bottom += portraitCycleHeight;
  });
  placedRects.forEach(rect => {
    rect.top += portraitCycleHeight;
    rect.bottom += portraitCycleHeight;
  });
  return plan;
}

function initLayout(items = MEDIA) {
  world.querySelectorAll('video').forEach(video => videoVisibilityObserver.unobserve(video));
  world.replaceChildren();
  placedRects = [];
  overviewCenter = { x: CENTER, y: CENTER };
  world.classList.remove('ready');
  const portraitLayout = isPortraitMobile();

  const mobileWidth = Math.max(280, window.innerWidth - 40);
  const portraitWidths = {
    lg: mobileWidth,
    md: (mobileWidth - 14) / 2,
    sm: (mobileWidth - 20) / 3,
  };
  const sourceOrder = items.map((item, i) => {
    const s = SIZES[item.size] || SIZES.md;
    const ratio = (item.w && item.h) ? (item.w / item.h) : (4/3);
    if (portraitLayout) {
      const w = portraitWidths[item.size] || portraitWidths.md;
      return { item, i, s, w: Math.round(w), h: Math.round(w / ratio) };
    }
    const baseArea = s * s * 1.15;
    return {
      item,
      i,
      s,
      w: Math.round(Math.sqrt(baseArea * ratio)),
      h: Math.round(Math.sqrt(baseArea / ratio)),
    };
  });
  const placementOrder = portraitLayout ? sourceOrder : sourceOrder.sort((a, b) => b.s - a.s);
  const portraitPlan = portraitLayout ? buildPortraitPlan(placementOrder) : null;

  placementOrder.forEach(({ item, i, w, h }, switchOrder) => {
    const placement = portraitLayout ? portraitPlan.get(i) : findSpot(w, h);
    const { x, y } = placement;
    const rot = ROTATIONS[i % ROTATIONS.length] * (portraitLayout ? .55 : 1);

    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.style.width = w + 'px';
    tile.style.height = h + 'px';
    tile.style.left = (x - w/2) + 'px';
    tile.style.top = (y - h/2) + 'px';
    tile.style.transform = `rotate(${rot}deg)`;
    tile.style.setProperty('--card-shadow', CARD_SHADOWS[i % CARD_SHADOWS.length]);
    tile.style.setProperty('--switch-order', switchOrder);
    
    tile.dataset.cx = x;
    tile.dataset.cy = y;
    if (portraitLayout) {
      tile.dataset.portraitRow = placement.rowIndex;
      portraitRows[placement.rowIndex].tiles.push(tile);
    }

    const placeholder = document.createElement('div');
    placeholder.className = 'placeholder';
    placeholder.innerHTML = item.type === 'video'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M17 9l4-2v10l-4-2"/></svg><span>Missing ' + item.file + '</span>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5L5 20"/></svg><span>Missing ' + item.file + '</span>';

    let mediaEl;
    if (item.type === 'video') {
      mediaEl = document.createElement('video');
      mediaEl.muted = true;
      mediaEl.defaultMuted = true;
      mediaEl.autoplay = true;
      mediaEl.loop = true;
      mediaEl.playsInline = true;
      mediaEl.preload = 'auto';
      mediaEl.disablePictureInPicture = true;
      mediaEl.setAttribute('muted', '');
      mediaEl.setAttribute('autoplay', '');
      mediaEl.setAttribute('loop', '');
      mediaEl.setAttribute('playsinline', '');
      mediaEl.setAttribute('webkit-playsinline', '');
      mediaEl.setAttribute('disableRemotePlayback', '');

      const revealWhenPlaying = () => revealTile(tile, placeholder);
      const tryPlayback = () => {
        if (document.hidden || mediaEl.dataset.offscreen === 'true') return;
        const playAttempt = mediaEl.play();
        if (playAttempt?.then) {
          playAttempt
            .then(() => {
              if (!mediaEl.paused && mediaEl.readyState >= 2) revealWhenPlaying();
            })
            // Low Power Mode or browser policy can still reject autoplay.
            // Reveal the loaded frame so the tile never remains inaccessible.
            .catch(() => revealTile(tile, placeholder));
        }
      };

      mediaEl.addEventListener('playing', revealWhenPlaying, { once: true });
      mediaEl.addEventListener('canplay', tryPlayback, { once: true });
      mediaEl.addEventListener('error', () => {
        mediaEl.classList.add('missing');
        revealTile(tile, placeholder, true);
      }, { once: true });
      mediaEl.src = mediaUrl(item);
    } else {
      mediaEl = document.createElement('img');
      mediaEl.loading = 'lazy';
      mediaEl.decoding = 'async';
      mediaEl.draggable = false;
      mediaEl.addEventListener('load', () => revealTile(tile, placeholder), { once: true });
      mediaEl.addEventListener('error', () => {
        mediaEl.classList.add('missing');
        revealTile(tile, placeholder, true);
      }, { once: true });
      mediaEl.src = mediaUrl(item);
    }

    const caption = document.createElement('div');
    caption.className = 'caption';
    caption.textContent = item.label;

    let info = null;
    if (item.text) {
      info = document.createElement('div');
      info.className = 'info';
      info.textContent = item.text;
    }

    tile.appendChild(placeholder);
    tile.appendChild(mediaEl);
    tile.appendChild(caption);
    if (info) tile.appendChild(info);
    tile.addEventListener('error', () => {}, true);

    world.appendChild(tile);
    if (item.type === 'video') videoVisibilityObserver.observe(mediaEl);
  });

  if (placedRects.length) {
    const left = Math.min(...placedRects.map(rect => rect.left));
    const right = Math.max(...placedRects.map(rect => rect.right));
    const top = Math.min(...placedRects.map(rect => rect.top));
    const bottom = Math.max(...placedRects.map(rect => rect.bottom));
    overviewCenter = {
      x: (left + right) / 2,
      y: (top + bottom) / 2,
    };
    overviewBounds = { left, right, top, bottom };
  }

  if (portraitLayout) {
    world.style.height = Math.ceil(portraitCycleHeight * 3) + 'px';
    requestAnimationFrame(() => {
      stage.scrollTop = Math.max(0, overviewBounds.top - 88);
      lastNativeScrollTop = stage.scrollTop;
    });
  } else {
    world.style.height = '';
  }
  
  world.classList.add('ready');
}

const stage = document.getElementById('stage');
const categoryNav = document.getElementById('category-nav');
const categoryTrack = document.getElementById('category-track');
const FOCUS_GUTTER = 24;
const videoVisibilityObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    const video = entry.target;
    if (entry.isIntersecting) {
      delete video.dataset.offscreen;
      if (!document.hidden) video.play().catch(() => {});
    } else {
      video.dataset.offscreen = 'true';
      if (!video.paused) video.pause();
    }
  });
}, {
  root: stage,
  rootMargin: '140px',
  threshold: 0.01,
});

function getOverviewZoom(){
  if (isPortraitMobile()) return 1;
  // Keep the original desktop composition, but give the world some breathing
  // room on narrow screens instead of rendering it at a desktop-sized scale.
  return Math.min(1, Math.max(0.62, window.innerWidth / 580));
}

function getOverviewPan(overviewZoom){
  if (window.innerWidth >= 600) return { x: 0, y: 0 };
  if (isPortraitMobile()) {
    return {
      x: CENTER - overviewCenter.x * overviewZoom,
      y: 88 - window.innerHeight / 2 + CENTER - overviewBounds.top * overviewZoom,
    };
  }
  return {
    x: CENTER - overviewCenter.x * overviewZoom,
    y: CENTER - overviewCenter.y * overviewZoom,
  };
}

function getFocusZoom(tile){
  const isMobile = window.innerWidth < 600;
  const tileWidth = tile.offsetWidth;
  const tileHeight = tile.offsetHeight;
  const horizontalGutter = isMobile ? FOCUS_GUTTER : 36;
  const verticalGutter = isMobile ? 96 : 56;
  const availableWidth = Math.max(1, window.innerWidth - horizontalGutter * 2);
  const captionReserve = isMobile ? 30 : 0;
  const infoReserve = isMobile && tile.querySelector('.info') ? 64 : 0;
  const availableHeight = Math.max(1, window.innerHeight - verticalGutter * 2 - captionReserve - infoReserve);

  const fitZoom = Math.min(
    availableWidth / tileWidth,
    availableHeight / tileHeight
  );
  return isMobile ? fitZoom : fitZoom * 0.5;
}

function getFocusedBounds(tile){
  // Focused tiles finish at 0°, even while their CSS rotation is animating.
  const tileTransform = tile.classList.contains('focused')
    ? new DOMMatrix()
    : new DOMMatrix(getComputedStyle(tile).transform);
  const info = tile.querySelector('.info');
  const infoExtension = info ? info.offsetHeight + 9 : 0;
  const caption = tile.querySelector('.caption');
  const captionExtension = isPortraitMobile() && tile.classList.contains('focused') && caption
    ? caption.offsetHeight + 10
    : 0;
  const totalHeight = tile.offsetHeight + infoExtension + captionExtension;

  return {
    width: Math.abs(tileTransform.a) * tile.offsetWidth +
      Math.abs(tileTransform.c) * totalHeight,
    height: Math.abs(tileTransform.b) * tile.offsetWidth +
      Math.abs(tileTransform.d) * totalHeight,
    offsetX: tileTransform.c * infoExtension / 2,
    offsetY: tileTransform.d * (infoExtension - captionExtension) / 2,
  };
}

let zoom = getOverviewZoom(), pan = getOverviewPan(zoom);
let focusedTile = null;
let preFocusView = null;
let lastNativeScrollTop = 0;
let nativeScrollFrame = null;
let nativeScrollAdjusting = false;

function shiftPortraitRow(row, distance){
  row.top += distance;
  row.bottom += distance;
  row.shift += distance;
  row.tiles.forEach(tile => {
    tile.style.translate = `0 ${row.shift}px`;
  });
}

function recycleNativeRows(){
  if (!isPortraitMobile() || focusedTile || !portraitCycleHeight || nativeScrollAdjusting) return;
  const viewportTop = stage.scrollTop;
  const viewportBottom = viewportTop + stage.clientHeight;
  const direction = Math.sign(viewportTop - lastNativeScrollTop);
  const buffer = 110;

  if (direction > 0) {
    portraitRows.forEach(row => {
      while (row.bottom < viewportTop - buffer) shiftPortraitRow(row, portraitCycleHeight);
    });
  } else if (direction < 0) {
    portraitRows.forEach(row => {
      while (row.top > viewportBottom + buffer) shiftPortraitRow(row, -portraitCycleHeight);
    });
  }

  if (viewportTop > portraitCycleHeight * 1.8) {
    nativeScrollAdjusting = true;
    portraitRows.forEach(row => shiftPortraitRow(row, -portraitCycleHeight));
    stage.scrollTop = viewportTop - portraitCycleHeight;
    nativeScrollAdjusting = false;
  } else if (viewportTop < portraitCycleHeight * .2) {
    nativeScrollAdjusting = true;
    portraitRows.forEach(row => shiftPortraitRow(row, portraitCycleHeight));
    stage.scrollTop = viewportTop + portraitCycleHeight;
    nativeScrollAdjusting = false;
  }
  lastNativeScrollTop = stage.scrollTop;
}

function updateTransform(){
  if (isPortraitMobile()) return;
  world.style.transform = `translate(-50%, -50%) translate(${pan.x}px, ${pan.y}px) scale(${zoom})`;
}
updateTransform();

function focusTile(tile){
  if (isPortraitMobile()) {
    const rect = tile.getBoundingClientRect();
    const hasInfo = Boolean(tile.querySelector('.info'));
    const labelReserve = 30;
    const infoReserve = hasInfo ? 64 : 0;
    const availableWidth = Math.max(1, window.innerWidth - FOCUS_GUTTER * 2);
    const availableHeight = Math.max(1, window.innerHeight - 192 - labelReserve - infoReserve);
    const focusScale = Math.min(
      availableWidth / tile.offsetWidth,
      availableHeight / tile.offsetHeight
    );
    const targetY = window.innerHeight / 2 + (labelReserve - infoReserve) / 2;

    preFocusView = { scrollTop: stage.scrollTop };
    tile.style.setProperty('--mobile-focus-x', `${window.innerWidth / 2 - (rect.left + rect.width / 2)}px`);
    tile.style.setProperty('--mobile-focus-y', `${targetY - (rect.top + rect.height / 2)}px`);
    tile.style.setProperty('--mobile-focus-scale', String(focusScale));
    tile.style.setProperty('--focus-ui-scale', String(1 / focusScale));
    focusedTile = tile;
    focusedTile.classList.add('focused');
    world.classList.add('has-focus');
    stage.classList.add('mobile-focus-mode');
    return;
  }

  if (!focusedTile) preFocusView = { zoom, pan: { ...pan } };
  focusedTile = tile;
  focusedTile.classList.remove('focus-settled');
  focusedTile.classList.add('focused');
  world.classList.add('has-focus');

  zoom = getFocusZoom(tile);
  const uiScale = window.innerWidth >= 641
    ? Math.min(1, Array.from(world.querySelectorAll('.tile')).reduce(
        (referenceZoom, candidate) => Math.min(referenceZoom, getFocusZoom(candidate)),
        zoom
      ) / zoom)
    : 1 / zoom;
  tile.style.setProperty('--focus-ui-scale', String(uiScale));
  const cx = parseFloat(tile.dataset.cx);
  const cy = parseFloat(tile.dataset.cy);
  const bounds = getFocusedBounds(tile);
  pan.x = CENTER - (cx + bounds.offsetX) * zoom;
  pan.y = CENTER - (cy + bounds.offsetY) * zoom;
}

function clearFocus(){
  const previousTile = focusedTile;
  if (isPortraitMobile()) {
    previousTile?.classList.remove('focus-settled');
    previousTile?.classList.add('unfocusing');
    previousTile?.classList.remove('focused');
    world.classList.remove('has-focus');
    focusedTile = null;
    setTimeout(() => {
      stage.classList.remove('mobile-focus-mode');
      previousTile?.classList.remove('unfocusing', 'focus-exiting');
      previousTile?.style.removeProperty('--mobile-focus-x');
      previousTile?.style.removeProperty('--mobile-focus-y');
      previousTile?.style.removeProperty('--mobile-focus-scale');
      previousTile?.style.removeProperty('--focus-ui-scale');
    }, 600);
    preFocusView = null;
    return;
  }

  previousTile?.classList.remove('focus-settled');
  previousTile?.classList.add('unfocusing');
  focusedTile?.classList.remove('focused');
  world.classList.remove('has-focus');
  focusedTile = null;
  zoom = getOverviewZoom();

  if (isPortraitMobile() && preFocusView) {
    zoom = preFocusView.zoom;
    pan = { ...preFocusView.pan };
  } else if (window.innerWidth < 600 && previousTile) {
    const cx = parseFloat(previousTile.dataset.cx);
    const cy = parseFloat(previousTile.dataset.cy);
    pan = { x: CENTER - cx * zoom, y: CENTER - cy * zoom };
  } else {
    pan = { x: 0, y: 0 };
  }
  preFocusView = null;

  setTimeout(() => {
    previousTile?.classList.remove('unfocusing', 'focus-exiting');
    previousTile?.style.removeProperty('--focus-ui-scale');
  }, 600);
}

let dragging = false, dragStart = null, panStart = null, moved = false, dragStartTarget = null;
let lastPointer = null, velocity = { x: 0, y: 0 };
let inertiaFrame = null, transitionLocked = false, transitionTimer = null;
let dragFrame = null;
let focusMotionFrame = null;
const FOCUS_MOTION_DURATION = 500;

function flushDragFrame(){
  if (dragFrame) cancelAnimationFrame(dragFrame);
  dragFrame = null;
  updateTransform();
}

function stopInertia(){
  if (inertiaFrame) cancelAnimationFrame(inertiaFrame);
  inertiaFrame = null;
  velocity = { x: 0, y: 0 };
}

function startInertia(){
  if (Math.hypot(velocity.x, velocity.y) < 0.04) return;
  let previousTime = performance.now();

  function glide(now){
    const elapsed = Math.min(32, now - previousTime);
    previousTime = now;
    const decay = Math.pow(0.91, elapsed / 16.67);
    velocity.x *= decay;
    velocity.y *= decay;
    if (!isPortraitMobile()) pan.x += velocity.x * elapsed;
    pan.y += velocity.y * elapsed;
    updateTransform();

    if (Math.hypot(velocity.x, velocity.y) > 0.015) {
      inertiaFrame = requestAnimationFrame(glide);
    } else {
      stopInertia();
    }
  }

  inertiaFrame = requestAnimationFrame(glide);
}

function transformParts(matrix){
  const scaleX = Math.hypot(matrix.a, matrix.b) || 1;
  return {
    x: matrix.e,
    y: matrix.f,
    rotation: Math.atan2(matrix.b, matrix.a),
    scaleX,
    scaleY: (matrix.a * matrix.d - matrix.b * matrix.c) / scaleX,
  };
}

function shortestRotation(from, to){
  let distance = (to - from + Math.PI) % (Math.PI * 2) - Math.PI;
  if (distance < -Math.PI) distance += Math.PI * 2;
  return distance;
}

function interpolatedTransform(from, to, progress){
  const rotation = from.rotation + shortestRotation(from.rotation, to.rotation) * progress;
  const x = from.x + (to.x - from.x) * progress;
  const y = from.y + (to.y - from.y) * progress;
  const scaleX = from.scaleX + (to.scaleX - from.scaleX) * progress;
  const scaleY = from.scaleY + (to.scaleY - from.scaleY) * progress;
  return `translate3d(${x}px, ${y}px, 0) rotate(${rotation}rad) scale(${scaleX}, ${scaleY})`;
}

function easeOutQuart(progress){
  return 1 - Math.pow(1 - progress, 4);
}

function animateTransformFrames(motions, startTime, duration){
  const preparedMotions = motions.map(motion => ({
    ...motion,
    fromParts: transformParts(motion.from),
    toParts: transformParts(motion.to),
  }));
  return new Promise(resolve => {
    function frame(now){
      const rawProgress = Math.min(1, Math.max(0, (now - startTime) / duration));
      const progress = easeOutQuart(rawProgress);
      preparedMotions.forEach(({ element, fromParts, toParts }) => {
        element.style.setProperty(
          'transform',
          interpolatedTransform(fromParts, toParts, progress),
          'important'
        );
      });

      if (rawProgress < 1) {
        focusMotionFrame = requestAnimationFrame(frame);
      } else {
        motions.forEach(({ element, restoreValue, restorePriority }) => {
          element.style.setProperty('transform', restoreValue, restorePriority);
        });
        focusMotionFrame = null;
        resolve();
      }
    }
    focusMotionFrame = requestAnimationFrame(frame);
  });
}

function animateCamera(change, motionTile){
  transitionLocked = true;
  const duration = FOCUS_MOTION_DURATION;
  if (focusMotionFrame) cancelAnimationFrame(focusMotionFrame);

  const beforeWorld = new DOMMatrix(getComputedStyle(world).transform);
  const beforeTile = motionTile ? new DOMMatrix(getComputedStyle(motionTile).transform) : null;
  const tileTransform = motionTile?.style.getPropertyValue('transform') || '';
  const tilePriority = motionTile?.style.getPropertyPriority('transform') || '';

  world.classList.add('transitioning');
  motionTile?.classList.add('focus-motion');
  change();
  updateTransform();

  const afterWorld = new DOMMatrix(getComputedStyle(world).transform);
  const afterTile = motionTile ? new DOMMatrix(getComputedStyle(motionTile).transform) : null;
  const targetWorldTransform = world.style.getPropertyValue('transform');
  const targetWorldPriority = world.style.getPropertyPriority('transform');
  const startTime = performance.now();
  const motions = [];

  if (!isPortraitMobile()) {
    motions.push({
      element: world,
      from: beforeWorld,
      to: afterWorld,
      restoreValue: targetWorldTransform,
      restorePriority: targetWorldPriority,
    });
  }
  if (motionTile && beforeTile && afterTile) {
    motions.push({
      element: motionTile,
      from: beforeTile,
      to: afterTile,
      restoreValue: tileTransform,
      restorePriority: tilePriority,
    });
  }
  const animation = animateTransformFrames(motions, startTime, duration);

  clearTimeout(transitionTimer);
  transitionTimer = setTimeout(async () => {
    await animation;
    world.classList.remove('transitioning');
    motionTile?.classList.remove('focus-motion');
    transitionLocked = false;
    focusedTile?.classList.remove('focus-entering');
    focusedTile?.classList.add('focus-settled');
  }, duration);
}

function beginFocus(tile){
  tile.classList.add('focus-entering');
  animateCamera(() => focusTile(tile), tile);
  setTimeout(() => {
    if (focusedTile === tile) {
      tile.classList.remove('focus-entering');
      tile.classList.add('focus-settled');
    }
  }, 120);
}

function beginClearFocus(){
  const exitingTile = focusedTile;
  exitingTile?.classList.add('focus-exiting');
  animateCamera(clearFocus, exitingTile);
}

stage.addEventListener('scroll', () => {
  if (!isPortraitMobile() || focusedTile || nativeScrollFrame) return;
  nativeScrollFrame = requestAnimationFrame(() => {
    nativeScrollFrame = null;
    recycleNativeRows();
  });
}, { passive: true });

stage.addEventListener('click', (event) => {
  if (!isPortraitMobile() || transitionLocked || categorySwitching) return;
  const tile = event.target.closest('.tile');
  if (focusedTile || tile) {
    if (focusedTile) beginClearFocus();
    else beginFocus(tile);
  }
});

stage.addEventListener('pointerdown', (e) => {
  if (isPortraitMobile()) return;
  if (transitionLocked) return;
  stopInertia();
  world.classList.remove('transitioning');
  dragging = true; 
  moved = false;
  dragStartTarget = e.target; 
  dragStart = { x: e.clientX, y: e.clientY };
  panStart = { x: pan.x, y: pan.y };
  lastPointer = { x: e.clientX, y: e.clientY, time: performance.now() };
  stage.classList.add('grabbing');
  stage.setPointerCapture(e.pointerId);
});

stage.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  const now = performance.now();
  const elapsed = Math.max(1, now - lastPointer.time);
  const nextVelocityX = (e.clientX - lastPointer.x) / elapsed;
  const nextVelocityY = (e.clientY - lastPointer.y) / elapsed;
  velocity.x = isPortraitMobile() ? 0 : velocity.x * 0.65 + nextVelocityX * 0.35;
  velocity.y = velocity.y * 0.65 + nextVelocityY * 0.35;
  lastPointer = { x: e.clientX, y: e.clientY, time: now };
  if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
  pan.x = isPortraitMobile() ? panStart.x : panStart.x + dx;
  pan.y = panStart.y + dy;
  if (!dragFrame) {
    dragFrame = requestAnimationFrame(() => {
      dragFrame = null;
      updateTransform();
    });
  }
});

stage.addEventListener('pointerup', (e) => {
  if (!dragging) return;
  dragging = false; 
  stage.classList.remove('grabbing');
  flushDragFrame();
  
  if (!moved) {
    const tile = dragStartTarget ? dragStartTarget.closest('.tile') : null;
    if (focusedTile || tile) {
      if (focusedTile) beginClearFocus();
      else beginFocus(tile);
    }
  } else {
    if (performance.now() - lastPointer.time > 80) {
      velocity = { x: 0, y: 0 };
    } else {
      const speed = Math.hypot(velocity.x, velocity.y);
      if (speed > 1.2) {
        velocity.x *= 1.2 / speed;
        velocity.y *= 1.2 / speed;
      }
    }
    startInertia();
  }
  
  dragStartTarget = null;
});

stage.addEventListener('pointercancel', () => { 
  dragging = false; 
  stage.classList.remove('grabbing'); 
  dragStartTarget = null;
  if (dragFrame) cancelAnimationFrame(dragFrame);
  dragFrame = null;
  stopInertia();
});

window.addEventListener('resize', () => {
  if (focusedTile) {
    focusTile(focusedTile);
  } else {
    zoom = getOverviewZoom();
    pan = getOverviewPan(zoom);
  }
  updateTransform();
  if (activeCategory) arrangeCategoryNav(activeCategory);
});

function categoryLabel(value){
  return value
    .replace(/[-_]+/g, ' ')
    .replace(/\b\w/g, letter => letter.toUpperCase());
}

function shuffled(items){
  const result = [...items];
  for (let index = result.length - 1; index > 0; index--) {
    const randomIndex = Math.floor(Math.random() * (index + 1));
    [result[index], result[randomIndex]] = [result[randomIndex], result[index]];
  }
  return result;
}

function getHomeSelection(limit = 15){
  const sourceCategories = categories.filter(category => category !== 'home');
  const pools = new Map(sourceCategories.map(category => [
    category,
    shuffled(MEDIA.filter(item => item.category === category)),
  ]));
  const selection = [];

  while (selection.length < limit) {
    let addedThisRound = false;
    shuffled(sourceCategories).forEach(category => {
      if (selection.length >= limit) return;
      const item = pools.get(category)?.pop();
      if (!item) return;
      selection.push(item);
      addedThisRound = true;
    });
    if (!addedThisRound) break;
  }

  return shuffled(selection);
}

function renderCategory(category){
  stopInertia();
  focusedTile?.classList.remove('focused');
  focusedTile = null;
  world.classList.remove('has-focus', 'transitioning');
  transitionLocked = false;
  clearTimeout(transitionTimer);

  const items = category === 'home'
    ? getHomeSelection(15)
    : MEDIA.filter(item => item.category === category);

  initLayout(items);
  zoom = getOverviewZoom();
  pan = getOverviewPan(zoom);
  updateTransform();
}

function arrangeCategoryNav(category){
  if (!categories.length) return;

  const buttons = new Map(
    [...categoryTrack.querySelectorAll('button')].map(button => [button.dataset.category, button])
  );
  let orderedCategories = categories;

  if (isPortraitMobile()) {
    const currentIndex = categories.indexOf(category);
    const startOffset = -Math.floor((categories.length - 1) / 2);
    orderedCategories = Array.from({ length: categories.length }, (_, index) => {
      const wrappedIndex = (currentIndex + startOffset + index + categories.length) % categories.length;
      return categories[wrappedIndex];
    });
  }

  orderedCategories.forEach(name => {
    const button = buttons.get(name);
    if (button) categoryTrack.appendChild(button);
  });
}

function updateCategoryNav(category, disabled = false){
  arrangeCategoryNav(category);
  categoryNav.querySelectorAll('button').forEach(button => {
    const isCurrent = button.dataset.category === category;
    button.toggleAttribute('aria-current', isCurrent);
    if (isCurrent) button.setAttribute('aria-current', 'page');
    button.disabled = disabled;
  });

  const currentButton = categoryNav.querySelector(`button[data-category="${CSS.escape(category)}"]`);
  if (currentButton && isPortraitMobile()) {
    requestAnimationFrame(() => {
      const targetLeft = currentButton.offsetLeft - (categoryNav.clientWidth - currentButton.offsetWidth) / 2;
      categoryNav.scrollTo({ left: targetLeft, behavior: activeCategory ? 'smooth' : 'auto' });
    });
  }
}

async function showCategory(category, { animate = true, updateUrl = true, replaceUrl = false } = {}){
  if (!categories.includes(category) || categorySwitching || category === activeCategory) return;

  categorySwitching = true;
  updateCategoryNav(activeCategory, true);

  if (animate && activeCategory) {
    world.classList.add('collection-exiting');
    const outgoingCount = world.querySelectorAll('.tile').length;
    await new Promise(resolve => setTimeout(resolve, 440 + Math.min(240, outgoingCount * 12)));
  }

  renderCategory(category);
  activeCategory = category;
  updateCategoryNav(category, true);
  if (animate) world.classList.add('collection-entering');

  if (updateUrl) {
    const method = replaceUrl ? 'replaceState' : 'pushState';
    history[method]({ category }, '', `#${encodeURIComponent(category)}`);
  }

  requestAnimationFrame(() => requestAnimationFrame(() => {
    world.classList.remove('collection-exiting');
  }));

  if (animate) {
    const incomingCount = world.querySelectorAll('.tile').length;
    await new Promise(resolve => setTimeout(resolve, 760 + Math.min(240, incomingCount * 12)));
    world.classList.remove('collection-entering');
  }
  categorySwitching = false;
  updateCategoryNav(category, false);
}

async function loadArchive(){
  try {
    const response = await fetch('media.json', { cache: 'no-cache' });
    if (!response.ok) throw new Error(`media.json returned ${response.status}`);

    const archive = await response.json();
    mediaBaseUrl = archive.mediaBaseUrl || '';
    MEDIA = (archive.items || []).map(item => {
      const extension = item.file.split('?')[0].split('.').pop().toLowerCase();
      return {
        ...item,
        category: item.category || 'uncategorized',
        label: item.label || item.file,
        text: item.text || '',
        size: ['sm', 'md', 'lg'].includes(item.size) ? item.size : 'md',
        type: item.type || (['mp4', 'mov', 'webm'].includes(extension) ? 'video' : 'photo'),
      };
    });

    categories = [
      'home',
      ...new Set(MEDIA.map(item => item.category).filter(category => category !== 'home')),
    ];
    categories.forEach(category => {
      const button = document.createElement('button');
      button.type = 'button';
      button.dataset.category = category;
      button.textContent = categoryLabel(category);
      button.addEventListener('click', () => showCategory(category));
      categoryTrack.appendChild(button);
    });

    if (categories.length) {
      const requestedCategory = decodeURIComponent(location.hash.slice(1)).toLowerCase();
      const initialCategory = categories.includes(requestedCategory) ? requestedCategory : categories[0];
      await showCategory(initialCategory, { animate: false, updateUrl: true, replaceUrl: true });
    } else {
      categoryNav.setAttribute('aria-disabled', 'true');
      world.classList.add('ready');
    }
  } catch (error) {
    console.error('Could not load the archive:', error);
    categoryNav.setAttribute('aria-disabled', 'true');
    categoryTrack.textContent = 'Archive unavailable';
    world.classList.add('ready');
  }
}

window.addEventListener('popstate', () => {
  const category = decodeURIComponent(location.hash.slice(1)).toLowerCase();
  if (categories.includes(category) && category !== activeCategory) {
    showCategory(category, { updateUrl: false });
  }
});

document.addEventListener('visibilitychange', () => {
  world.querySelectorAll('video').forEach(video => {
    if (document.hidden) {
      video.dataset.resumePlayback = video.paused ? '' : 'true';
      if (!video.paused) video.pause();
    } else if (video.dataset.resumePlayback === 'true' && video.dataset.offscreen !== 'true') {
      delete video.dataset.resumePlayback;
      video.play().catch(() => {});
    }
  });
});

loadArchive();
</script>
