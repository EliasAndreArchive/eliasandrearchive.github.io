<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive — Elias Andre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #fbfaf6;
    --ink: #1c1b17;
    --ink-dim: #9a9686;
    --ink-faint: #c7c3b6;
    --line: #e5e2d6;
    --red: #b84a2a;
    --yellow: #e6b13c;
    --blue: #4c74a8;
    --font: 'Inter', system-ui, sans-serif;
    --camera-duration: .78s;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    height:100%;
    overflow:hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; 
    user-select: none; 
  }

  /* ---------- chrome ---------- */
  .wordmark{
    position: fixed; top: 26px; left: 28px;
    display:flex; align-items:center; gap: 9px;
    z-index: 20;
    pointer-events: none;
  }
  .dots{ display:flex; }
  .dots span{ width:8px; height:8px; border-radius:50%; display:block; margin-left:-3px; }
  .dots span:first-child{ margin-left:0; background: var(--red); }
  .dots span:nth-child(2){ background: var(--yellow); }
  .dots span:nth-child(3){ background: var(--blue); }
  .wordmark .name{ font-size:15px; font-weight:600; letter-spacing:-0.01em; }

  .hint{
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    z-index: 20;
    pointer-events: none;
    white-space: nowrap;
  }

  .category-indicator{
    position: fixed;
    top: 22px;
    right: 28px;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: none;
  }
  .category-indicator .current-category{
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .02em;
    color: var(--ink);
  }
  .category-indicator .category-count{
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .mobile-collection-nav{
    display: none;
  }
  .mobile-view-toggle{
    display: none;
  }
  .mobile-instagram{
    display: none;
  }
  @media (max-width: 640px){
    body::before{
      content: '';
      position: fixed;
      inset: 0 0 auto;
      height: 92px;
      z-index: 15;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(251,250,246,.98) 0%, rgba(251,250,246,.86) 58%, rgba(251,250,246,0) 100%);
    }
    .wordmark{
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      justify-content: center;
      width: calc(100% - 32px);
    }
    .wordmark .name{ max-width: none; font-size: 12px; white-space: nowrap; }
    .category-indicator{
      top: 52px;
      left: 50%;
      right: auto;
      transform: translateX(-50%);
    }
    .hint{ display: none; }
    .mobile-collection-nav{
      position: fixed;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 172px;
      padding: 12px 17px;
      border: 1px solid rgba(28,27,23,.18);
      border-radius: 999px;
      background: rgba(251,250,246,.9);
      box-shadow: 0 10px 28px rgba(28,27,23,.14);
      color: var(--ink);
      font: 600 10px/1 var(--font);
      letter-spacing: .09em;
      text-transform: uppercase;
      justify-content: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      touch-action: manipulation;
    }
    .mobile-collection-nav:active{
      transform: translateX(-50%) scale(.97);
    }
    .mobile-collection-nav:disabled{
      opacity: .55;
      cursor: default;
    }
    .mobile-view-toggle{
      position: fixed;
      top: 45px;
      left: 25%;
      transform: translateX(-50%);
      z-index: 40;
      display: block;
      padding: 8px 11px;
      border: 1px solid rgba(28,27,23,.16);
      border-radius: 999px;
      background: rgba(251,250,246,.88);
      box-shadow: 0 7px 20px rgba(28,27,23,.1);
      color: var(--ink-dim);
      font: 600 9px/1 var(--font);
      letter-spacing: .08em;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      touch-action: manipulation;
    }
    .mobile-instagram{
      position: fixed;
      top: 45px;
      left: 75%;
      transform: translateX(-50%);
      z-index: 40;
      display: block;
      padding: 8px 11px;
      border: 1px solid rgba(28,27,23,.16);
      border-radius: 999px;
      background: rgba(251,250,246,.88);
      box-shadow: 0 7px 20px rgba(28,27,23,.1);
      color: var(--ink-dim);
      font: 600 9px/1 var(--font);
      letter-spacing: .08em;
      text-decoration: none;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      touch-action: manipulation;
    }
  }

  /* ---------- stage / world ---------- */
  #stage{
    position: fixed; inset: 0;
    cursor: grab;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage.grabbing{ cursor: grabbing; }
  #world{
    position: absolute;
    top: 50%; left: 50%;
    width: 1400px; height: 1400px;
    transform-origin: 0 0;
    will-change: transform;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #world.ready {
    opacity: 1;
  }
  
  #world.transitioning {
    transition: transform var(--camera-duration) cubic-bezier(0.65, 0, 0.35, 1), opacity 0.3s ease;
  }

  #world.has-focus .tile:not(.focused) {
    filter: blur(8px) grayscale(30%);
    opacity: 0.4;
  }
  #world.switching-out .tile{
    opacity: 0 !important;
    scale: .02;
    pointer-events: none;
  }

  /* ---------- tiles ---------- */
  .tile{
    position: absolute;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: #fff;
    box-shadow: var(--card-shadow, 10px 14px 24px -10px rgba(28,27,23,0.3));
    overflow: visible;
    cursor: pointer;
    opacity: 0;
    scale: 0.02;
    pointer-events: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    transition:
      transform var(--camera-duration) cubic-bezier(0.65, 0, 0.35, 1),
      scale .72s cubic-bezier(0.16, 1, 0.3, 1),
      border-color .15s ease,
      border-width .3s ease,
      border-radius .45s cubic-bezier(0.22, 1, 0.36, 1),
      box-shadow .45s ease,
      filter .6s ease,
      opacity .42s ease;
  }
  .tile:focus{ outline: none; }
  .tile.video-tile{ background: #111; }
  .tile.media-ready{
    opacity: 1;
    scale: 1;
    pointer-events: auto;
  }
  .tile:not(.media-ready){
    opacity: 0 !important;
  }
  .tile:hover{ border-color: var(--ink-faint); z-index: 5; }
  
  .tile.focused {
    z-index: 50;
    border-width: 0;
    border-radius: 0;
    box-shadow: none;
    transform: rotate(0deg) !important;
  }

  .tile img, .tile video{
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none; 
    border-radius: inherit;
    transition: border-radius .45s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @media (max-width: 640px){
    #world.has-focus .tile:not(.focused){
      filter: blur(8px) grayscale(30%);
      opacity: .4;
    }
  }
  .tile video{ background: #111; }

  .tile .caption{
    position: absolute; left:0; right:0; bottom:0;
    padding: 20px 12px 8px;
    background: linear-gradient(to top, rgba(8,8,8,0.82) 0%, rgba(8,8,8,0.42) 58%, rgba(8,8,8,0) 100%);
    border-radius: 0 0 5px 5px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.35);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .15s ease, transform .15s ease, border-radius .45s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
    z-index: 2;
  }
  .tile:hover .caption, .tile.focused .caption { 
    opacity: 1; transform: none; 
  }
  .tile.focused .caption{
    border-radius: 0;
    padding: calc(20px * var(--focus-ui-scale, 1)) calc(12px * var(--focus-ui-scale, 1)) calc(8px * var(--focus-ui-scale, 1));
    font-size: calc(10px * var(--focus-ui-scale, 1));
  }

  .tile .info{
    position: absolute;
    top: calc(100% + 9px);
    left: 4px; right: 4px;
    padding: 8px 10px;
    border: 1px solid rgba(229,226,214,0.8);
    border-radius: 5px;
    background: rgba(251,250,246,0.94);
    color: var(--ink-dim);
    font-size: 9px;
    line-height: 1.45;
    letter-spacing: 0.01em;
    opacity: 0;
    transform: translateY(-3px);
    transition: opacity .2s ease .25s, transform .2s ease .25s;
    pointer-events: none;
  }
  .tile.focused .info{
    opacity: 0;
    transform: none;
    top: calc(100% + 9px * var(--focus-ui-scale, 1));
    left: 0;
    right: 0;
    padding: calc(8px * var(--focus-ui-scale, 1)) 0 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font-size: calc(12.5px * var(--focus-ui-scale, 1));
    font-weight: 600;
    line-height: 1.45;
    transition: opacity .2s ease;
  }

  .tile.focused .caption{
    opacity: 0;
    transition: opacity .2s ease;
  }
  .tile.focused.focus-settled .caption,
  .tile.focused.focus-settled .info{
    opacity: 1;
  }

  @media (max-width: 640px){
    :root{ --camera-duration: .62s; }
    .tile:hover:not(.focused) .caption{
      opacity: 0;
      transform: translateY(4px);
    }
  }

  .tile .placeholder{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 8px;
    background:
      repeating-linear-gradient(135deg, #f1efe8 0px, #f1efe8 10px, #ece9df 10px, #ece9df 20px);
    border-radius: inherit;
    overflow: hidden;
  }
  .tile .placeholder svg{ width:18px; height:18px; stroke: var(--ink-faint); }
  .tile .placeholder span{
    font-size: 9px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color: var(--ink-dim);
  }
  .tile img.missing, .tile video.missing{ display:none; }
</style>
</head>
<body>

  <div class="wordmark">
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="name">Elias Andre Archive | © 2026 All rights reserved</div>
  </div>
  <div class="category-indicator" aria-live="polite">
    <span class="current-category" id="current-category"></span>
    <span class="category-count" id="category-count"></span>
  </div>
  <div class="hint" id="hint">Drag to pan · scroll to change collection</div>
  <button class="mobile-view-toggle" id="mobile-view-toggle" type="button" aria-label="Switch mobile layout" aria-pressed="true">Stream</button>
  <a class="mobile-instagram" href="https://www.instagram.com/illya.andr/" target="_blank" rel="noopener noreferrer">Instagram</a>
  <button class="mobile-collection-nav" id="mobile-collection-nav" type="button"></button>

  <div id="stage">
    <div id="world"></div>
  </div>

<script>
let MEDIA = [];
let mediaBaseUrl = '';
let mobileViewMode = 'stream';

const SIZES = { sm: 130, md: 190, lg: 250 };
const ROTATIONS = [-3.4, 1.8, -2.2, 3.7, -1.3, 2.8, -3.9, 1.1, 3.1, -2.7, 1.6, -3.2, 2.4, -1.8, 3.9, -2.5, 1.4];
const CARD_SHADOWS = [
  '12px 15px 25px -10px rgba(28,27,23,0.30)',
  '-9px 14px 23px -11px rgba(28,27,23,0.27)',
  '15px 9px 27px -12px rgba(28,27,23,0.29)',
  '-12px 11px 24px -10px rgba(28,27,23,0.25)',
  '8px 17px 26px -11px rgba(28,27,23,0.31)',
  '14px -5px 25px -12px rgba(28,27,23,0.24)',
  '-7px 16px 28px -12px rgba(28,27,23,0.29)',
];
const world = document.getElementById('world');
const CENTER = 700; 
const GAP = 12; 
let placedRects = [];
let overviewCenter = { x: CENTER, y: CENTER };
let overviewBounds = { left: CENTER, right: CENTER, top: CENTER, bottom: CENTER };

function overlaps(a, b, pad){
  return a.left - pad < b.right && a.right + pad > b.left &&
         a.top - pad < b.bottom && a.bottom + pad > b.top;
}

function findSpot(w, h){
  const dTheta = 0.11;
  const growth = 5.5;
  let theta = Math.random() * Math.PI * 2; 
  let iterations = 0;
  while (iterations < 4000) {
    const r = growth * theta;
    const cx = CENTER + r * Math.cos(theta);
    const cy = CENTER + r * Math.sin(theta);
    const rect = { left: cx - w/2, top: cy - h/2, right: cx + w/2, bottom: cy + h/2 };
    const collides = placedRects.some(p => overlaps(rect, p, GAP));
    if (!collides) {
      placedRects.push(rect);
      return { x: cx, y: cy };
    }
    theta += dTheta;
    iterations++;
  }
  const cx = CENTER, cy = CENTER;
  placedRects.push({ left: cx - w/2, top: cy - h/2, right: cx + w/2, bottom: cy + h/2 });
  return { x: cx, y: cy };
}

function revealTile(tile, placeholder, keepPlaceholder = false) {
  if (tile.classList.contains('media-ready')) return;
  if (!keepPlaceholder) placeholder.style.display = 'none';

  // Two frames guarantee that the browser paints the tiny initial state
  // before transitioning the tile to its normal size.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    tile.classList.add('media-ready');
  }));
}

function mediaUrl(item){
  if (/^https?:\/\//i.test(item.file)) return item.file;
  return mediaBaseUrl.replace(/\/?$/, '/') + item.file.replace(/^\//, '');
}

function buildPortraitPlan(entries){
  const remaining = [...entries];
  const plan = new Map();
  let top = 0;
  let rowIndex = 0;
  const rowShifts = [-5, 4, -2, 5, 1, -4];
  const verticalJitter = [-3, 2, 0, 3, -2, 1];

  while (remaining.length) {
    const lead = remaining.shift();
    const capacity = lead.item.size === 'lg' ? 1 : lead.item.size === 'sm' ? 3 : 2;
    const row = [lead];

    for (let cursor = 0; cursor < remaining.length && row.length < capacity;) {
      if (remaining[cursor].item.size === lead.item.size) {
        row.push(remaining.splice(cursor, 1)[0]);
      } else {
        cursor++;
      }
    }

    const gap = lead.item.size === 'sm' ? 12 : 18;
    const rowWidth = row.reduce((sum, entry) => sum + entry.w, 0) + gap * (row.length - 1);
    const rowHeight = Math.max(...row.map(entry => entry.h));
    let left = CENTER - rowWidth / 2 + rowShifts[rowIndex % rowShifts.length];

    row.forEach((entry, itemIndex) => {
      const x = left + entry.w / 2;
      const y = top + rowHeight / 2 + verticalJitter[(rowIndex + itemIndex) % verticalJitter.length];
      plan.set(entry.i, { x, y });
      placedRects.push({
        left,
        top: y - entry.h / 2,
        right: left + entry.w,
        bottom: y + entry.h / 2,
      });
      left += entry.w + gap;
    });

    top += rowHeight + 22;
    rowIndex++;
  }

  return plan;
}

function initLayout(items = MEDIA) {
  world.replaceChildren();
  placedRects = [];
  overviewCenter = { x: CENTER, y: CENTER };
  world.classList.remove('ready');
  const portraitLayout = isPortraitMobile();

  const sourceOrder = items.map((item, i) => {
    const s = SIZES[item.size] || SIZES.md;
    const ratio = (item.w && item.h) ? (item.w / item.h) : (4/3);
    if (portraitLayout) {
      // At the .74 portrait zoom these resolve to roughly 360px-wide rows:
      // one large, two medium, or three small tiles with equal outer margins.
      const portraitWidths = { lg: 486, md: 235, sm: 152 };
      const w = portraitWidths[item.size] || portraitWidths.md;
      return { item, i, s, w, h: Math.round(w / ratio) };
    }
    const baseArea = s * s * 1.15;
    return {
      item,
      i,
      s,
      w: Math.round(Math.sqrt(baseArea * ratio)),
      h: Math.round(Math.sqrt(baseArea / ratio)),
    };
  });
  const placementOrder = portraitLayout
    ? sourceOrder
    : sourceOrder.sort((a, b) => b.s - a.s);
  const portraitPlan = portraitLayout ? buildPortraitPlan(placementOrder) : null;

  placementOrder.forEach(({ item, i, w, h }) => {
    const { x, y } = portraitLayout ? portraitPlan.get(i) : findSpot(w, h);
    const rot = ROTATIONS[i % ROTATIONS.length] * (portraitLayout ? .58 : 1);

    const tile = document.createElement('div');
    tile.className = `tile ${item.type}-tile`;
    tile.style.width = w + 'px';
    tile.style.height = h + 'px';
    tile.style.left = (x - w/2) + 'px';
    tile.style.top = (y - h/2) + 'px';
    tile.style.transform = `rotate(${rot}deg)`;
    tile.style.setProperty('--card-shadow', CARD_SHADOWS[i % CARD_SHADOWS.length]);
    
    tile.dataset.cx = x;
    tile.dataset.cy = y;

    const placeholder = document.createElement('div');
    placeholder.className = 'placeholder';
    placeholder.innerHTML = item.type === 'video'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M17 9l4-2v10l-4-2"/></svg><span>Missing ' + item.file + '</span>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.4"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5L5 20"/></svg><span>Missing ' + item.file + '</span>';

    let mediaEl;
    if (item.type === 'video') {
      mediaEl = document.createElement('video');
      mediaEl.muted = true;
      mediaEl.defaultMuted = true;
      mediaEl.autoplay = true;
      mediaEl.loop = true;
      mediaEl.playsInline = true;
      mediaEl.preload = 'auto';
      mediaEl.setAttribute('muted', '');
      mediaEl.setAttribute('autoplay', '');
      mediaEl.setAttribute('loop', '');
      mediaEl.setAttribute('playsinline', '');
      mediaEl.setAttribute('webkit-playsinline', '');

      const revealWhenPlaying = () => revealTile(tile, placeholder);
      const tryPlayback = () => {
        const playAttempt = mediaEl.play();
        if (playAttempt?.then) {
          playAttempt
            .then(() => {
              if (!mediaEl.paused && mediaEl.readyState >= 2) revealWhenPlaying();
            })
            // Low Power Mode or browser policy can still reject autoplay.
            // Reveal the loaded frame so the tile never remains inaccessible.
            .catch(() => revealTile(tile, placeholder));
        }
      };

      mediaEl.addEventListener('playing', revealWhenPlaying, { once: true });
      mediaEl.addEventListener('canplay', tryPlayback, { once: true });
      mediaEl.addEventListener('error', () => {
        mediaEl.classList.add('missing');
        revealTile(tile, placeholder, true);
      }, { once: true });
      mediaEl.src = mediaUrl(item);
    } else {
      mediaEl = document.createElement('img');
      mediaEl.loading = 'lazy';
      mediaEl.draggable = false;
      mediaEl.addEventListener('load', () => revealTile(tile, placeholder), { once: true });
      mediaEl.addEventListener('error', () => {
        mediaEl.classList.add('missing');
        revealTile(tile, placeholder, true);
      }, { once: true });
      mediaEl.src = mediaUrl(item);
    }

    const caption = document.createElement('div');
    caption.className = 'caption';
    caption.textContent = item.label;

    let info = null;
    if (item.text) {
      info = document.createElement('div');
      info.className = 'info';
      info.textContent = item.text;
    }

    tile.appendChild(placeholder);
    tile.appendChild(mediaEl);
    tile.appendChild(caption);
    if (info) tile.appendChild(info);
    tile.addEventListener('error', () => {}, true);

    world.appendChild(tile);
  });

  if (placedRects.length) {
    const left = Math.min(...placedRects.map(rect => rect.left));
    const right = Math.max(...placedRects.map(rect => rect.right));
    const top = Math.min(...placedRects.map(rect => rect.top));
    const bottom = Math.max(...placedRects.map(rect => rect.bottom));
    overviewCenter = {
      x: (left + right) / 2,
      y: (top + bottom) / 2,
    };
    overviewBounds = { left, right, top, bottom };
  }
  
  world.classList.add('ready');
}

const stage = document.getElementById('stage');
const currentCategoryLabel = document.getElementById('current-category');
const categoryCount = document.getElementById('category-count');
const hint = document.getElementById('hint');
const mobileCollectionNav = document.getElementById('mobile-collection-nav');
const mobileViewToggle = document.getElementById('mobile-view-toggle');
const DESKTOP_FOCUS_ZOOM = 2.4;

function isPortraitMobile(){
  return mobileViewMode === 'stream' && window.innerWidth <= 640 && window.innerHeight > window.innerWidth;
}

function getCameraDuration(){
  return window.innerWidth <= 640 ? 620 : 780;
}

function getOverviewZoom(){
  if (isPortraitMobile()) return .74;
  // Keep the original desktop composition, but give the world some breathing
  // room on narrow screens instead of rendering it at a desktop-sized scale.
  return Math.min(1, Math.max(0.62, window.innerWidth / 580));
}

function getOverviewPan(overviewZoom){
  if (window.innerWidth >= 600) return { x: 0, y: 0 };
  if (isPortraitMobile()) {
    return {
      x: CENTER - overviewCenter.x * overviewZoom,
      y: getPortraitPanBounds(overviewZoom).max,
    };
  }
  return {
    x: CENTER - overviewCenter.x * overviewZoom,
    y: CENTER - overviewCenter.y * overviewZoom,
  };
}

function getPortraitPanBounds(activeZoom = zoom){
  const topMargin = 86;
  const bottomMargin = 78;
  return {
    max: topMargin - window.innerHeight / 2 + CENTER - overviewBounds.top * activeZoom,
    min: window.innerHeight / 2 + CENTER - bottomMargin - overviewBounds.bottom * activeZoom,
  };
}

function clampPortraitPanY(value){
  if (!isPortraitMobile()) return value;
  const bounds = getPortraitPanBounds();
  return Math.min(bounds.max, Math.max(bounds.min, value));
}

function getFocusZoom(tile){
  const tileWidth = tile.offsetWidth;
  const tileHeight = tile.offsetHeight;
  const horizontalGutter = window.innerWidth < 600 ? 24 : 56;
  const verticalGutter = window.innerWidth < 600 ? 96 : 72;
  const availableWidth = Math.max(1, window.innerWidth - horizontalGutter * 2);
  const availableHeight = Math.max(1, window.innerHeight - verticalGutter * 2);
  const infoReserve = tile.querySelector('.info') ? (window.innerWidth < 600 ? 64 : 56) : 0;

  return Math.min(
    DESKTOP_FOCUS_ZOOM,
    availableWidth / tileWidth,
    (availableHeight - infoReserve) / tileHeight
  );
}

function getFocusedBounds(tile){
  // Focused tiles finish at 0°, even while their CSS rotation is animating.
  const tileTransform = tile.classList.contains('focused')
    ? new DOMMatrix()
    : new DOMMatrix(getComputedStyle(tile).transform);
  const info = tile.querySelector('.info');
  const infoExtension = info ? info.offsetHeight + 9 : 0;
  const totalHeight = tile.offsetHeight + infoExtension;

  return {
    width: Math.abs(tileTransform.a) * tile.offsetWidth +
      Math.abs(tileTransform.c) * totalHeight,
    height: Math.abs(tileTransform.b) * tile.offsetWidth +
      Math.abs(tileTransform.d) * totalHeight,
    offsetX: tileTransform.c * infoExtension / 2,
    offsetY: tileTransform.d * infoExtension / 2,
  };
}

let zoom = getOverviewZoom(), pan = getOverviewPan(zoom);
let focusedTile = null;
let preFocusView = null;
let panRenderFrame = null;

function updateTransform(){
  world.style.transform = `translate3d(-50%, -50%, 0) translate3d(${pan.x}px, ${pan.y}px, 0) scale(${zoom})`;
}

function scheduleTransform(){
  if (panRenderFrame) return;
  panRenderFrame = requestAnimationFrame(() => {
    panRenderFrame = null;
    updateTransform();
  });
}
updateTransform();

function focusTile(tile){
  if (!focusedTile) {
    preFocusView = { zoom, pan: { x: pan.x, y: pan.y } };
  }
  focusedTile = tile;
  focusedTile.classList.remove('focus-settled');
  focusedTile.classList.add('focused');
  world.classList.add('has-focus');

  zoom = getFocusZoom(tile);
  tile.style.setProperty('--focus-ui-scale', String(1 / zoom));
  const cx = parseFloat(tile.dataset.cx);
  const cy = parseFloat(tile.dataset.cy);
  const bounds = getFocusedBounds(tile);
  pan.x = CENTER - (cx + bounds.offsetX) * zoom;
  pan.y = CENTER - (cy + bounds.offsetY) * zoom;
}

function clearFocus(){
  const previousTile = focusedTile;
  previousTile?.classList.remove('focus-settled');
  world.classList.remove('has-focus');
  focusedTile = null;
  zoom = preFocusView?.zoom ?? getOverviewZoom();

  if (isPortraitMobile() && preFocusView) {
    pan = { ...preFocusView.pan };
  } else if (isPortraitMobile() && previousTile) {
    const cy = parseFloat(previousTile.dataset.cy);
    pan = {
      x: CENTER - overviewCenter.x * zoom,
      y: clampPortraitPanY(CENTER - cy * zoom),
    };
  } else if (window.innerWidth < 600 && previousTile) {
    const cx = parseFloat(previousTile.dataset.cx);
    const cy = parseFloat(previousTile.dataset.cy);
    pan = { x: CENTER - cx * zoom, y: CENTER - cy * zoom };
  } else {
    pan = { x: 0, y: 0 };
  }
  preFocusView = null;

  clearTimeout(focusRestoreTimer);
  focusRestoreTimer = setTimeout(() => {
    previousTile?.classList.remove('focused');
    previousTile?.style.removeProperty('--focus-ui-scale');
  }, getCameraDuration());
}

let dragging = false, dragStart = null, panStart = null, moved = false, dragStartTarget = null;
let lastPointer = null, velocity = { x: 0, y: 0 };
let inertiaFrame = null, transitionLocked = false, transitionTimer = null;
let focusRestoreTimer = null;
let categorySwitching = false;
let categories = [];
let activeCategoryIndex = 0;
let wheelProgress = 0;
let wheelResetTimer = null;

function stopInertia(){
  if (inertiaFrame) cancelAnimationFrame(inertiaFrame);
  inertiaFrame = null;
  velocity = { x: 0, y: 0 };
}

function startInertia(){
  if (Math.hypot(velocity.x, velocity.y) < 0.04) return;
  let previousTime = performance.now();

  function glide(now){
    const elapsed = Math.min(32, now - previousTime);
    previousTime = now;
    const decay = Math.pow(0.91, elapsed / 16.67);
    velocity.x *= decay;
    velocity.y *= decay;
    if (isPortraitMobile()) {
      velocity.x = 0;
      const nextY = clampPortraitPanY(pan.y + velocity.y * elapsed);
      if (nextY === pan.y) velocity.y = 0;
      pan.y = nextY;
    } else {
      pan.x += velocity.x * elapsed;
      pan.y += velocity.y * elapsed;
    }
    updateTransform();

    if (Math.hypot(velocity.x, velocity.y) > 0.015) {
      inertiaFrame = requestAnimationFrame(glide);
    } else {
      stopInertia();
    }
  }

  inertiaFrame = requestAnimationFrame(glide);
}

function animateCamera(change){
  transitionLocked = true;
  world.classList.add('transitioning');
  change();
  updateTransform();

  clearTimeout(transitionTimer);
  transitionTimer = setTimeout(() => {
    world.classList.remove('transitioning');
    transitionLocked = false;
    if (focusedTile) {
      world.classList.add('has-focus');
      focusedTile.classList.add('focus-settled');
    }
  }, getCameraDuration() + 30);
}

stage.addEventListener('pointerdown', (e) => {
  if (transitionLocked || categorySwitching) return;
  stopInertia();
  world.classList.remove('transitioning');
  dragging = true; 
  moved = false;
  dragStartTarget = e.target; 
  dragStart = { x: e.clientX, y: e.clientY };
  panStart = { x: pan.x, y: pan.y };
  lastPointer = { x: e.clientX, y: e.clientY, time: performance.now() };
  stage.classList.add('grabbing');
  stage.setPointerCapture(e.pointerId);
});

stage.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  const now = performance.now();
  const elapsed = Math.max(1, now - lastPointer.time);
  const nextVelocityX = (e.clientX - lastPointer.x) / elapsed;
  const nextVelocityY = (e.clientY - lastPointer.y) / elapsed;
  velocity.x = velocity.x * 0.65 + nextVelocityX * 0.35;
  velocity.y = velocity.y * 0.65 + nextVelocityY * 0.35;
  lastPointer = { x: e.clientX, y: e.clientY, time: now };
  if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
  pan.x = isPortraitMobile() ? panStart.x : panStart.x + dx;
  pan.y = isPortraitMobile() ? clampPortraitPanY(panStart.y + dy) : panStart.y + dy;
  scheduleTransform();
});

stage.addEventListener('pointerup', (e) => {
  if (!dragging) return;
  dragging = false; 
  stage.classList.remove('grabbing');
  
  if (!moved) {
    const tile = dragStartTarget ? dragStartTarget.closest('.tile') : null;
    if (focusedTile || tile) {
      animateCamera(() => focusedTile ? clearFocus() : focusTile(tile));
    }
  } else {
    if (performance.now() - lastPointer.time > 80) {
      velocity = { x: 0, y: 0 };
    } else {
      const speed = Math.hypot(velocity.x, velocity.y);
      if (speed > 1.2) {
        velocity.x *= 1.2 / speed;
        velocity.y *= 1.2 / speed;
      }
    }
    startInertia();
  }
  
  dragStartTarget = null;
});

stage.addEventListener('pointercancel', () => { 
  dragging = false; 
  stage.classList.remove('grabbing'); 
  dragStartTarget = null;
  stopInertia();
});

window.addEventListener('resize', () => {
  if (focusedTile) {
    focusTile(focusedTile);
  } else {
    zoom = getOverviewZoom();
    pan = getOverviewPan(zoom);
  }
  scheduleTransform();
});

function categoryLabel(value){
  return value
    .replace(/[-_]+/g, ' ')
    .replace(/\b\w/g, letter => letter.toUpperCase());
}

function showCategory(category){
  stopInertia();
  focusedTile?.classList.remove('focused');
  focusedTile?.style.removeProperty('--focus-ui-scale');
  focusedTile = null;
  preFocusView = null;
  world.classList.remove('has-focus', 'transitioning');
  transitionLocked = false;
  clearTimeout(transitionTimer);

  const items = MEDIA.filter(item => item.category === category);

  initLayout(items);
  zoom = getOverviewZoom();
  pan = getOverviewPan(zoom);
  updateTransform();

  activeCategoryIndex = Math.max(0, categories.indexOf(category));
  currentCategoryLabel.textContent = categoryLabel(category);
  categoryCount.textContent = `${String(activeCategoryIndex + 1).padStart(2, '0')} / ${String(categories.length).padStart(2, '0')}`;
  const previous = categories[activeCategoryIndex - 1];
  const next = categories[activeCategoryIndex + 1];
  hint.textContent = next
    ? `Drag to pan · scroll down for ${categoryLabel(next)}`
    : previous
      ? `Drag to pan · scroll up for ${categoryLabel(previous)}`
      : 'Drag to pan · click a piece to focus';

  if (next) {
    mobileCollectionNav.textContent = `Next · ${categoryLabel(next)} ↓`;
    mobileCollectionNav.dataset.targetIndex = String(activeCategoryIndex + 1);
  } else if (previous) {
    mobileCollectionNav.textContent = `Previous · ${categoryLabel(previous)} ↑`;
    mobileCollectionNav.dataset.targetIndex = String(activeCategoryIndex - 1);
  } else {
    mobileCollectionNav.textContent = 'Only collection';
    mobileCollectionNav.dataset.targetIndex = '';
  }
  mobileCollectionNav.disabled = categories.length < 2;
  mobileViewToggle.textContent = mobileViewMode === 'stream' ? 'Stream' : 'Canvas';
  mobileViewToggle.setAttribute('aria-pressed', String(mobileViewMode === 'stream'));
}

async function changeCategory(nextIndex){
  if (categorySwitching || nextIndex < 0 || nextIndex >= categories.length || nextIndex === activeCategoryIndex) return;
  categorySwitching = true;
  stopInertia();
  world.classList.add('switching-out');

  await new Promise(resolve => setTimeout(resolve, 520));

  world.classList.remove('switching-out');
  showCategory(categories[nextIndex]);
  categorySwitching = false;
}

mobileCollectionNav.addEventListener('click', () => {
  const targetIndex = Number(mobileCollectionNav.dataset.targetIndex);
  if (mobileCollectionNav.dataset.targetIndex !== '') changeCategory(targetIndex);
});

[mobileCollectionNav, mobileViewToggle].forEach(control => {
  control.addEventListener('pointerdown', event => event.stopPropagation());
  control.addEventListener('pointerup', event => event.stopPropagation());
});

mobileViewToggle.addEventListener('click', async event => {
  event.stopPropagation();
  if (categorySwitching || window.innerWidth > 640) return;
  categorySwitching = true;
  stopInertia();
  world.classList.add('switching-out');
  await new Promise(resolve => setTimeout(resolve, 420));
  mobileViewMode = mobileViewMode === 'stream' ? 'canvas' : 'stream';
  world.classList.remove('switching-out');
  showCategory(categories[activeCategoryIndex]);
  categorySwitching = false;
});

async function loadArchive(){
  try {
    const response = await fetch('media.json', { cache: 'no-cache' });
    if (!response.ok) throw new Error(`media.json returned ${response.status}`);

    const archive = await response.json();
    mediaBaseUrl = archive.mediaBaseUrl || '';
    MEDIA = (archive.items || []).map(item => {
      const extension = item.file.split('?')[0].split('.').pop().toLowerCase();
      return {
        ...item,
        category: item.category || 'uncategorized',
        label: item.label || item.file,
        text: item.text || '',
        size: ['sm', 'md', 'lg'].includes(item.size) ? item.size : 'md',
        type: item.type || (['mp4', 'mov', 'webm'].includes(extension) ? 'video' : 'photo'),
      };
    });

    categories = [...new Set(MEDIA.map(item => item.category))];

    if (categories.length) {
      showCategory(categories[0]);
    } else {
      currentCategoryLabel.textContent = 'Archive unavailable';
      world.classList.add('ready');
    }
  } catch (error) {
    console.error('Could not load the archive:', error);
    currentCategoryLabel.textContent = 'Archive unavailable';
    categoryCount.textContent = '';
    world.classList.add('ready');
  }
}

stage.addEventListener('wheel', event => {
  event.preventDefault();
  if (isPortraitMobile()) {
    if (categorySwitching || focusedTile) return;
    stopInertia();
    pan.y = clampPortraitPanY(pan.y - event.deltaY);
    updateTransform();
    return;
  }
  if (categorySwitching || focusedTile || Math.abs(event.deltaY) < Math.abs(event.deltaX)) return;

  const direction = Math.sign(event.deltaY);
  if ((direction < 0 && activeCategoryIndex === 0) ||
      (direction > 0 && activeCategoryIndex === categories.length - 1)) {
    wheelProgress = 0;
    return;
  }

  if (wheelProgress && Math.sign(wheelProgress) !== direction) wheelProgress = 0;
  wheelProgress += event.deltaY;
  clearTimeout(wheelResetTimer);
  wheelResetTimer = setTimeout(() => { wheelProgress = 0; }, 450);

  if (Math.abs(wheelProgress) >= 220) {
    const nextIndex = activeCategoryIndex + Math.sign(wheelProgress);
    wheelProgress = 0;
    changeCategory(nextIndex);
  }
}, { passive: false });

loadArchive();
</script>
</body>
</html>
